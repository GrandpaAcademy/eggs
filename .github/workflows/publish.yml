name: Publish Packages as Public

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Make all yolks packages public via gh CLI
        run: |
          PACKAGES=(
            yolks_python_3.14 yolks_python_3.13 yolks_python_3.12 yolks_python_3.11 yolks_python_3.10
            yolks_nodejs_24 yolks_nodejs_22 yolks_nodejs_20
            yolks_golang_1.24 yolks_golang_1.23 yolks_golang_1.22
            yolks_rust_latest
            yolks_java_21 yolks_java_17
            yolks_caddy_latest
            yolks_postgres_17 yolks_postgres_16 yolks_postgres_15
            yolks_redis_latest
            yolks_valkey_latest
            yolks_nginx_latest
            yolks_hermes_agent
          )
          
          for pkg in "${PACKAGES[@]}"; do
            echo -n "Making ${pkg} public... "
            # gh api to update package visibility
            RESP=$(gh api -X PATCH \
              "user/packages/container/${pkg}" \
              -f visibility=public 2>&1) && echo "OK" || echo "FAIL: ${RESP}"
          done
