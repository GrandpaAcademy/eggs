name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changes.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: changes
        name: Detect changed Dockerfiles
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IMAGES=$(find docker -name Dockerfile -exec dirname {} \; | sed 's|^docker/||' | sort | jq -R -s -c 'split("\n") | map(select(. != ""))')
          else
            IMAGES=$(git diff --name-only HEAD~1 HEAD -- docker/ 2>/dev/null | grep Dockerfile | sed 's|docker/||;s|/Dockerfile||' | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          fi
          echo "images=$IMAGES" >> "$GITHUB_OUTPUT"
          echo "Building images: $IMAGES"

  build:
    needs: detect-changes
    if: github.event_name == 'push' && fromJSON(needs.detect-changes.outputs.images)[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.images) }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/grandpaacademy/yolks_${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Rebuild all on manual dispatch
  build-all:
    if: github.event_name == 'workflow_dispatch'
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: python/3.14
            tag: python_3.14
          - image: python/3.13
            tag: python_3.13
          - image: python/3.12
            tag: python_3.12
          - image: python/3.11
            tag: python_3.11
          - image: python/3.10
            tag: python_3.10
          - image: nodejs/26
            tag: nodejs_26
          - image: nodejs/24
            tag: nodejs_24
          - image: nodejs/22
            tag: nodejs_22
          - image: nodejs/20
            tag: nodejs_20
          - image: golang/1.26
            tag: golang_1.26
          - image: golang/1.24
            tag: golang_1.24
          - image: golang/1.23
            tag: golang_1.23
          - image: golang/1.22
            tag: golang_1.22
          - image: rust/latest
            tag: rust_latest
          - image: java/21
            tag: java_21
          - image: java/17
            tag: java_17
          - image: caddy/latest
            tag: caddy_latest
          - image: postgres/18
            tag: postgres_18
          - image: postgres/17
            tag: postgres_17
          - image: postgres/16
            tag: postgres_16
          - image: postgres/15
            tag: postgres_15
          - image: redis/latest
            tag: redis_latest
          - image: valkey/latest
            tag: valkey_latest
          - image: nginx/latest
            tag: nginx_latest
          - image: bun/1
            tag: bun_1
          - image: php/8.5
            tag: php_8.5
          - image: php/8.4
            tag: php_8.4
          - image: ruby/4
            tag: ruby_4
          - image: ruby/3.4
            tag: ruby_3.4
          - image: dotnet/10
            tag: dotnet_10
          - image: dotnet/9
            tag: dotnet_9
          - image: swift/6.3
            tag: swift_6.3
          - image: swift/6.1
            tag: swift_6.1
          - image: deno/2
            tag: deno_2
          - image: elixir/1.20
            tag: elixir_1.20
          - image: nim/2
            tag: nim_2
          - image: crystal/1
            tag: crystal_1
          - image: zig/0.14
            tag: zig_0.14
          - image: hermes-agent/latest
            tag: hermes_agent
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker/${{ matrix.image }}
          push: true
          tags: ${{ env.REGISTRY }}/grandpaacademy/yolks_${{ matrix.tag }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Make all packages public after build
  publish:
    needs: [build, build-all]
    if: always() && !cancelled() && (needs.build.result == 'success' || needs.build-all.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Make all yolks packages public
        run: |
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          ORG="grandpaacademy"
          
          PACKAGES=(
            yolks_python_3.14 yolks_python_3.13 yolks_python_3.12 yolks_python_3.11 yolks_python_3.10
            yolks_nodejs_24 yolks_nodejs_22 yolks_nodejs_20
            yolks_golang_1.24 yolks_golang_1.23 yolks_golang_1.22
            yolks_rust_latest
            yolks_java_21 yolks_java_17
            yolks_caddy_latest
            yolks_postgres_17 yolks_postgres_16 yolks_postgres_15
            yolks_redis_latest
            yolks_valkey_latest
            yolks_nginx_latest
            yolks_hermes_agent
          )
          
          for pkg in "${PACKAGES[@]}"; do
            echo -n "Making ${pkg} public... "
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PATCH \
              "https://api.github.com/orgs/${ORG}/packages/container/${pkg}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d '{"visibility":"public"}')
            echo "${STATUS}"
          done
